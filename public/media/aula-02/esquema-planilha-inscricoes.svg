<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <!-- Esquema próprio do deck (não é captura de produto): planilha de inscrições com dados fictícios. -->
  <rect x="0" y="0" width="1180" height="640" rx="28" fill="#0A0C10"/>
  <!-- tabela: colunas 220 / 330 / 280 / 200 a partir de x = 130 -->
  <rect x="130" y="130" width="1030" height="360" rx="14" fill="#10131A" stroke="#2C3240" stroke-width="3"/>
  <rect x="130" y="130" width="1030" height="90" rx="14" fill="#1F1147"/>
  <rect x="130" y="190" width="1030" height="30" fill="#1F1147"/>
  <g stroke="#20252F" stroke-width="3">
    <line x1="130" y1="310" x2="1160" y2="310"/>
    <line x1="130" y1="400" x2="1160" y2="400"/>
    <line x1="350" y1="130" x2="350" y2="490"/>
    <line x1="680" y1="130" x2="680" y2="490"/>
    <line x1="960" y1="130" x2="960" y2="490"/>
  </g>
  <!-- cabeçalho: os fields -->
  <g font-size="38" font-weight="600" fill="#F2F4F9">
    <text x="152" y="188">nome</text>
    <text x="372" y="188">email</text>
    <text x="702" y="188">telefone</text>
    <text x="982" y="188">trilha</text>
  </g>
  <!-- linhas: as things (dados fictícios) -->
  <g font-size="35" fill="#D6DBE6">
    <text x="152" y="278">Ana Reis</text>
    <text x="372" y="278">ana@hack.test</text>
    <text x="702" y="278">11 90000-0001</text>
    <text x="982" y="278">Web</text>
    <text x="152" y="368">Bruno Dias</text>
    <text x="372" y="368">bruno@hack.test</text>
    <text x="702" y="368">11 90000-0002</text>
    <text x="982" y="368">Mobile</text>
    <text x="152" y="458">Carla Luz</text>
    <text x="372" y="458">carla@hack.test</text>
    <text x="702" y="458">11 90000-0003</text>
    <text x="982" y="458">IA</text>
  </g>
  <!-- realce: uma coluna = field -->
  <rect x="352" y="132" width="326" height="356" fill="none" stroke="#8B5CF6" stroke-width="5" stroke-dasharray="14 10" rx="6"/>
  <text x="515" y="104" font-size="38" font-weight="600" fill="#C9B6FF" text-anchor="middle">field</text>
  <!-- realce: uma linha = thing -->
  <rect x="132" y="312" width="1026" height="86" fill="#8B5CF6" fill-opacity="0.12" stroke="#8B5CF6" stroke-width="5" rx="6"/>
  <text x="114" y="368" font-size="36" font-weight="600" fill="#C9B6FF" text-anchor="end">thing</text>
  <!-- a tabela inteira = data type -->
  <text x="130" y="568" font-size="38" font-weight="600" fill="#C9B6FF">data type</text>
  <text x="318" y="568" font-size="36" fill="#AAB2C4">Inscricao: a tabela inteira</text>
</svg>
