<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1560" width="720" height="1560">
  <!-- Esquema desenhado (não é captura): app de check-in gerado a partir da planilha. Genérico, sem marcas. -->
  <style>
    .ui { font-family: Geist, 'Segoe UI', Inter, Arial, sans-serif; }
  </style>
  <rect width="720" height="1560" fill="#0A0C10"/>
  <!-- barra superior -->
  <rect x="0" y="0" width="720" height="210" fill="#10131A"/>
  <text x="48" y="168" class="ui" font-size="64" font-weight="650" fill="#F2F4F9">Check-in</text>
  <!-- busca -->
  <rect x="40" y="250" width="640" height="104" rx="26" fill="#10131A" stroke="#2C3240" stroke-width="4"/>
  <circle cx="104" cy="300" r="20" fill="none" stroke="#838CA1" stroke-width="5"/>
  <line x1="119" y1="315" x2="134" y2="330" stroke="#838CA1" stroke-width="5" stroke-linecap="round"/>
  <text x="160" y="318" class="ui" font-size="48" fill="#838CA1">Buscar por nome</text>

  <!-- grupo Web -->
  <text x="48" y="448" class="ui" font-size="48" font-weight="600" fill="#8FEAD8">Web</text>
  <text x="672" y="448" class="ui" font-size="44" fill="#5B6375" text-anchor="end">3</text>
  <rect x="40" y="476" width="640" height="150" rx="28" fill="#171B24"/>
  <text x="80" y="566" class="ui" font-size="52" fill="#F2F4F9">Ana Exemplo</text>
  <rect x="452" y="516" width="196" height="70" rx="35" fill="#06352E" stroke="#1FC8A9" stroke-width="3"/>
  <text x="550" y="564" class="ui" font-size="40" fill="#8FEAD8" text-anchor="middle">presente</text>

  <rect x="40" y="646" width="640" height="236" rx="28" fill="#171B24"/>
  <text x="80" y="730" class="ui" font-size="52" fill="#F2F4F9">Elisa Ficticia</text>
  <rect x="80" y="762" width="380" height="88" rx="22" fill="#1FC8A9"/>
  <path d="M112 806 l14 14 l26 -30" stroke="#050608" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="172" y="822" class="ui" font-size="42" font-weight="600" fill="#050608">Fazer check-in</text>

  <rect x="40" y="902" width="640" height="150" rx="28" fill="#171B24"/>
  <text x="80" y="992" class="ui" font-size="52" fill="#F2F4F9">Íris Modelo</text>

  <!-- grupo Mobile -->
  <text x="48" y="1136" class="ui" font-size="48" font-weight="600" fill="#8FEAD8">Mobile</text>
  <text x="672" y="1136" class="ui" font-size="44" fill="#5B6375" text-anchor="end">3</text>
  <rect x="40" y="1164" width="640" height="150" rx="28" fill="#171B24"/>
  <text x="80" y="1254" class="ui" font-size="52" fill="#F2F4F9">Bruno Teste</text>
  <rect x="452" y="1204" width="196" height="70" rx="35" fill="#06352E" stroke="#1FC8A9" stroke-width="3"/>
  <text x="550" y="1252" class="ui" font-size="40" fill="#8FEAD8" text-anchor="middle">presente</text>

  <!-- rodapé -->
  <rect x="0" y="1420" width="720" height="140" fill="#10131A"/>
  <text x="360" y="1504" class="ui" font-size="40" fill="#5B6375" text-anchor="middle">Esquema, não é captura</text>
