<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 1000" width="1560" height="1000">
  <!-- Esquema desenhado (não é captura): resposta JSON da ViaCEP como o navegador mostra com "pretty-print". -->
  <style>
    .mono { font-family: 'Geist Mono', 'Cascadia Mono', Consolas, 'Courier New', monospace; font-size: 40px; }
    .ui { font-family: Geist, 'Segoe UI', Inter, Arial, sans-serif; }
    .k { fill: #8FEAD8; }
    .s { fill: #D6DBE6; }
    .p { fill: #838CA1; }
    .n { fill: #5B6375; }
  </style>
  <rect width="1560" height="1000" fill="#0A0C10"/>
  <!-- barra do visualizador de JSON -->
  <rect x="0" y="0" width="1560" height="92" fill="#10131A"/>
  <rect x="0" y="92" width="1560" height="2" fill="#20252F"/>
  <rect x="64" y="28" width="36" height="36" rx="8" fill="#1FC8A9"/>
  <path d="M73 46 l8 8 l14 -16" stroke="#050608" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="120" y="58" class="ui" font-size="36" fill="#AAB2C4">Formatar JSON</text>
  <text x="1496" y="58" class="ui" font-size="36" fill="#5B6375" text-anchor="end">Esquema da resposta</text>
  <!-- números de linha -->
  <g class="mono n" text-anchor="end">
    <text x="112" y="168">1</text><text x="112" y="224">2</text><text x="112" y="280">3</text>
    <text x="112" y="336">4</text><text x="112" y="392">5</text><text x="112" y="448">6</text>
    <text x="112" y="504">7</text><text x="112" y="560">8</text><text x="112" y="616">9</text>
    <text x="112" y="672">10</text><text x="112" y="728">11</text><text x="112" y="784">12</text>
    <text x="112" y="840">13</text><text x="112" y="896">14</text><text x="112" y="952">15</text>
  </g>
  <g class="mono" xml:space="preserve">
    <text x="160" y="168" class="p">{</text>
    <text x="160" y="224"><tspan class="k">  "cep"</tspan><tspan class="p">: </tspan><tspan class="s">"01001-000"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="280"><tspan class="k">  "logradouro"</tspan><tspan class="p">: </tspan><tspan class="s">"Praça da Sé"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="336"><tspan class="k">  "complemento"</tspan><tspan class="p">: </tspan><tspan class="s">"lado ímpar"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="392"><tspan class="k">  "unidade"</tspan><tspan class="p">: </tspan><tspan class="s">""</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="448"><tspan class="k">  "bairro"</tspan><tspan class="p">: </tspan><tspan class="s">"Sé"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="504"><tspan class="k">  "localidade"</tspan><tspan class="p">: </tspan><tspan class="s">"São Paulo"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="560"><tspan class="k">  "uf"</tspan><tspan class="p">: </tspan><tspan class="s">"SP"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="616"><tspan class="k">  "estado"</tspan><tspan class="p">: </tspan><tspan class="s">"São Paulo"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="672"><tspan class="k">  "regiao"</tspan><tspan class="p">: </tspan><tspan class="s">"Sudeste"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="728"><tspan class="k">  "ibge"</tspan><tspan class="p">: </tspan><tspan class="s">"3550308"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="784"><tspan class="k">  "gia"</tspan><tspan class="p">: </tspan><tspan class="s">"1004"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="840"><tspan class="k">  "ddd"</tspan><tspan class="p">: </tspan><tspan class="s">"11"</tspan><tspan class="p">,</tspan></text>
    <text x="160" y="896"><tspan class="k">  "siafi"</tspan><tspan class="p">: </tspan><tspan class="s">"7107"</tspan></text>
    <text x="160" y="952" class="p">}</text>
  </g>
  <!-- painel lateral: status da resposta -->
  <rect x="1060" y="150" width="436" height="236" rx="24" fill="#10131A" stroke="#2C3240" stroke-width="3"/>
  <text x="1096" y="214" class="ui" font-size="34" fill="#838CA1">Resposta</text>
  <text x="1096" y="290" class="mono" font-size="56" fill="#F2F4F9">200 OK</text>
  <text x="1096" y="350" class="ui" font-size="32" fill="#8FEAD8">application/json</text>
</svg>
