services:
  aulas:
    build: .
    image: aulas-nocode:latest
    container_name: aulas-nocode
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${PORTA:-8080}:80"
    volumes:
      # Capturas e vídeos de backup: copie para public/media/aula-0N/ na VPS e eles
      # aparecem na hora, sem rebuild.
      - ./public/media:/usr/share/nginx/html/media:ro

  # Mural da turma (envios dos alunos) e feedback das aulas. O nginx repassa /api/ para cá.
  api:
    build: ./server
    image: aulas-nocode-api:latest
    container_name: aulas-nocode-api
    restart: unless-stopped
    environment:
      # Senha inicial da área do professor (professor.html). Defina no .env; pode ser trocada pelo painel.
      SENHA_PROFESSOR: ${SENHA_PROFESSOR:-}
    volumes:
      # Envios, anexos e respostas ficam aqui, fora do container (faça backup desta pasta).
      - ./dados:/dados
      # Documentos .md só para o professor: aparecem na aba Materiais da área do professor.
      - ./materiais-professor:/materiais:ro
