server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    sendfile on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Páginas: sempre revalidar, para uma atualização aparecer na hora.
    location ~* \.html$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Arquivos com hash no nome (JS, CSS, fontes): cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Capturas e vídeos (volume montado): revalidar, e 404 real quando o arquivo
    # ainda não existe, para o deck mostrar "Captura pendente".
    location /media/ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
